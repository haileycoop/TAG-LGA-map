<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      height: 100vh;
    }
  </style>
  <title>Victoria Councils Map</title>
</head>

<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    var map = L.map('map').setView([-37.8136, 144.9631], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // TAG adopters: single source of truth in data/tag-adopters.json
    // Boundaries: data/geo/councils-vic.geojson
    // Data source: https://data.gov.au/dataset/ds-dga-bdf92691-c6fe-42b9-a0e2-a4cd716fa811/details
    // Converted to GeoJSON using QGIS — licensed under Creative Commons
    // TODO: ensure we attribute the data source if we use this openly
    Promise.all([
      fetch('data/tag-adopters.json').then(function (r) {
        if (!r.ok) throw new Error('Failed to load tag-adopters.json: ' + r.status);
        return r.json();
      }),
      fetch('data/geo/councils-vic.geojson').then(function (r) {
        if (!r.ok) throw new Error('Failed to load councils-vic.geojson: ' + r.status);
        return r.json();
      })
    ]).then(function (results) {
      var tagPayload = results[0];
      var geoData = results[1];
      var list = tagPayload.adopters;
      if (!Array.isArray(list)) {
        throw new Error('tag-adopters.json must contain an "adopters" array');
      }
      var adopters = new Set(list);

      L.geoJson(geoData, {
        style: function (feature) {
          var name = feature.properties && feature.properties.LGA_NAME;
          var isTag = name && adopters.has(name);
          return {
            fillColor: isTag ? '#02fa07' : 'gray',
            weight: 2,
            opacity: 1,
            color: '#f55a42',
            fillOpacity: isTag ? 0.6 : 0.2
          };
        },
        onEachFeature: function (feature, layer) {
          if (feature.properties && feature.properties.LGA_NAME) {
            layer.bindPopup(feature.properties.LGA_NAME);
          } else {
            console.warn("No 'LGA_NAME' property found for this feature:", feature);
          }
        }
      }).addTo(map);
    }).catch(function (err) {
      console.error(err);
      document.body.insertAdjacentHTML(
        'afterbegin',
        '<p style="font-family:sans-serif;padding:1rem;background:#fee;color:#800;">Map data failed to load. ' +
        'If you just cloned the repo, add <code>data/geo/councils-vic.geojson</code> (your Victoria LGA GeoJSON; you can copy from the former <code>councils.geojson</code> at the project root).</p>'
      );
    });
  </script>

</body>

</html>
