<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      height: 100vh;
    }

    .abs-attribution {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.85);
    }
  </style>
  <title>Australia — Councils (TAG)</title>
</head>

<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    var map = L.map('map').setView([-25.5, 134], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Boundaries: ABS ASGS Edition 3 Local Government Areas 2024 (GDA2020), simplified for web.
    // Build from: scripts/build_councils_au.py — see script header for ABS download URL.
    // Boundaries © Australian Bureau of Statistics — use per ABS licence when publishing.
    // TAG adopters: data/tag-adopters.json (5-digit ABS lgaCode values).
    Promise.all([
      fetch('data/tag-adopters.json').then(function (r) {
        if (!r.ok) throw new Error('Failed to load tag-adopters.json: ' + r.status);
        return r.json();
      }),
      fetch('data/geo/councils-au.geojson').then(function (r) {
        if (!r.ok) throw new Error('Failed to load councils-au.geojson: ' + r.status);
        return r.json();
      })
    ]).then(function (results) {
      var tagPayload = results[0];
      var geoData = results[1];
      var list = tagPayload.adopters;
      if (!Array.isArray(list)) {
        throw new Error('tag-adopters.json must contain an "adopters" array');
      }
      var adopters = new Set(list.map(function (c) { return String(c).trim(); }));

      L.geoJson(geoData, {
        style: function (feature) {
          var code = feature.properties && feature.properties.lgaCode;
          var isTag = code != null && adopters.has(String(code));
          return {
            fillColor: isTag ? '#02fa07' : 'gray',
            weight: 1,
            opacity: 1,
            color: '#f55a42',
            fillOpacity: isTag ? 0.6 : 0.2
          };
        },
        onEachFeature: function (feature, layer) {
          var p = feature.properties;
          if (p && p.lgaName) {
            var label = p.lgaName + (p.stateName ? ' (' + p.stateName + ')' : '');
            if (p.lgaCode) {
              label += ' — ' + p.lgaCode;
            }
            layer.bindPopup(label);
          } else {
            console.warn('Missing lgaName on feature:', feature);
          }
        }
      }).addTo(map);

      var absNote = L.control({ position: 'bottomright' });
      absNote.onAdd = function () {
        var d = L.DomUtil.create('div', 'abs-attribution');
        d.innerHTML = 'LGA boundaries: ABS ASGS 2024 (simplified). Check ABS licence before public use.';
        return d;
      };
      absNote.addTo(map);
    }).catch(function (err) {
      console.error(err);
      document.body.insertAdjacentHTML(
        'afterbegin',
        '<p style="font-family:sans-serif;padding:1rem;background:#fee;color:#800;">Map data failed to load. ' +
        'Run <code>python3 scripts/build_councils_au.py --download</code> from the repo root to fetch ABS boundaries and build <code>data/geo/councils-au.geojson</code>.</p>'
      );
    });
  </script>

</body>

</html>
