<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    :root {
      --panel-width: 390px;
      --ui-bg: #ffffff;
      --ui-border: #d8d8d8;
      --ui-muted: #666;
      --ui-success: #0b7a2d;
      --ui-warning-bg: #fff6e5;
      --ui-warning-border: #f0d9a7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      height: 100vh;
    }

    .app-shell {
      height: 100vh;
      display: flex;
      width: 100%;
    }

    #map {
      height: 100%;
      width: 100%;
      min-width: 0;
      flex: 1;
    }

    .btn {
      border: 1px solid var(--ui-border);
      background: #fff;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .sidebar {
      position: relative;
      width: min(94vw, var(--panel-width));
      min-width: 320px;
      height: 100%;
      background: var(--ui-bg);
      border-left: 1px solid var(--ui-border);
      display: flex;
      flex-direction: column;
      box-shadow: -2px 0 10px rgba(0, 0, 0, 0.08);
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .view-toggle button {
      border: none;
      background: transparent;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .view-toggle button.active {
      background: #efefef;
      font-weight: 600;
    }

    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--ui-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }

    .mode-pill {
      border: 1px solid var(--ui-border);
      border-radius: 999px;
      font-size: 11px;
      padding: 2px 7px;
      white-space: nowrap;
      color: #333;
      background: #fafafa;
    }

    .sidebar-body {
      overflow: auto;
      padding: 10px 12px 100px;
      flex: 1;
    }

    .hint {
      margin: 8px 0 10px;
      font-size: 12px;
      color: var(--ui-muted);
      line-height: 1.4;
    }

    .warning {
      border: 1px solid var(--ui-warning-border);
      background: var(--ui-warning-bg);
      border-radius: 8px;
      padding: 8px;
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.4;
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .suggestions {
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      padding: 6px;
      margin-bottom: 10px;
      background: #fafafa;
      display: none;
    }

    .suggestions.active {
      display: block;
    }

    .suggestions-title {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--ui-muted);
    }

    .suggestion-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 4px 2px;
      border-bottom: 1px dotted #e4e4e4;
    }

    .suggestion-row:last-child {
      border-bottom: none;
    }

    .state-section {
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      margin-bottom: 9px;
      overflow: hidden;
    }

    .state-header {
      width: 100%;
      text-align: left;
      border: none;
      background: #f8f8f8;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .state-zoom {
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .state-list {
      padding: 6px 9px;
      display: none;
      max-height: 250px;
      overflow: auto;
    }

    .state-list.open {
      display: block;
    }

    .council-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px dotted #ebebeb;
      font-size: 12px;
    }

    .council-row:last-child {
      border-bottom: none;
    }

    .council-zoom {
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #555;
      font-size: 11px;
    }

    .sidebar-footer {
      position: sticky;
      bottom: 0;
      border-top: 1px solid var(--ui-border);
      background: #fff;
      padding: 10px 12px;
      display: grid;
      gap: 8px;
    }

    .footer-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .footer-actions.hidden {
      display: none;
    }

    .status {
      font-size: 12px;
      color: #444;
      min-height: 16px;
    }

    .status.success {
      color: var(--ui-success);
    }

    .partners-total {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      background: #fafafa;
    }

    .abs-attribution {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.85);
    }
  </style>
  <title>Australia - Councils (TAG)</title>
</head>

<body>
  <div class="app-shell">
    <div id="map"></div>

    <aside id="sidebar" class="sidebar" aria-hidden="true">
      <div class="sidebar-header">
        <h2 id="sidebarTitle" class="sidebar-title">TAG Partners</h2>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="view-toggle">
            <button id="partnersViewBtn" class="active" type="button">TAG Partners</button>
            <button id="manageViewBtn" type="button">Manage Partners</button>
          </div>
          <span id="modePill" class="mode-pill"></span>
        </div>
      </div>

      <div class="sidebar-body">
        <div id="webWarning" class="warning" style="display:none;"></div>
        <p id="hintText" class="hint"></p>

        <input id="searchInput" class="search-input" placeholder="Search council name or code" />
        <div id="suggestions" class="suggestions"></div>

        <div id="stateContainer"></div>
        <div id="partnersTotal" class="partners-total"></div>
      </div>

      <div class="sidebar-footer">
        <div class="footer-actions">
          <button id="exportBtn" class="btn">Export JSON</button>
          <button id="copyBtn" class="btn">Copy JSON</button>
          <button id="resetBtn" class="btn">Reset</button>
          <button id="requestBtn" class="btn">Request changes from Hailey</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([-25.5, 134], 4.5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var stateOrder = ['ACT', 'NSW', 'NT', 'QLD', 'SA', 'TAS', 'VIC', 'WA', 'OT'];
    var PARTNER_SHADES = [
      '#f2e5ff', '#e6ccff', '#d9b3ff', '#cc99ff', '#bf80ff',
      '#b366ff', '#a64dff', '#9933ff', '#8c1aff', '#7f00ff',
      '#7300e6', '#6700cc', '#5c00b3', '#520099', '#480080',
      '#a975ff', '#9f6bff', '#9561ff', '#8b57ff', '#814dff'
    ];
    var stateCodeToAbbrev = {
      '1': 'NSW',
      '2': 'VIC',
      '3': 'QLD',
      '4': 'SA',
      '5': 'WA',
      '6': 'TAS',
      '7': 'NT',
      '8': 'ACT',
      '9': 'OT'
    };

    function isPrivateIpv4(host) {
      if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) return false;
      var p = host.split('.').map(function (x) { return Number(x); });
      if (p.some(function (n) { return Number.isNaN(n) || n < 0 || n > 255; })) return false;
      return (
        p[0] === 10 ||
        (p[0] === 172 && p[1] >= 16 && p[1] <= 31) ||
        (p[0] === 192 && p[1] === 168) ||
        (p[0] === 169 && p[1] === 254)
      );
    }

    function isLikelyLocalHost(hostname) {
      if (!hostname) return false;
      return (
        hostname === 'localhost' ||
        hostname === '127.0.0.1' ||
        hostname === '0.0.0.0' ||
        hostname === '::1' ||
        hostname.endsWith('.local') ||
        isPrivateIpv4(hostname)
      );
    }

    var forceAdmin = new URLSearchParams(location.search).get('admin') === '1';
    var isLocalAdmin = forceAdmin || isLikelyLocalHost(location.hostname);
    var sidebar = document.getElementById('sidebar');
    var sidebarTitle = document.getElementById('sidebarTitle');
    var partnersViewBtn = document.getElementById('partnersViewBtn');
    var manageViewBtn = document.getElementById('manageViewBtn');
    var modePill = document.getElementById('modePill');
    var webWarning = document.getElementById('webWarning');
    var hintText = document.getElementById('hintText');
    var searchInput = document.getElementById('searchInput');
    var suggestionsEl = document.getElementById('suggestions');
    var stateContainer = document.getElementById('stateContainer');
    var exportBtn = document.getElementById('exportBtn');
    var copyBtn = document.getElementById('copyBtn');
    var resetBtn = document.getElementById('resetBtn');
    var requestBtn = document.getElementById('requestBtn');
    var statusEl = document.getElementById('status');
    var partnersTotalEl = document.getElementById('partnersTotal');

    modePill.textContent = isLocalAdmin ? 'Local admin mode' : 'Web shared mode';
    if (!isLocalAdmin) {
      webWarning.textContent = 'Manage Partners is available, but changes are temporary and not saved to shared data. Use "Request changes from Hailey".';
    }
    sidebar.setAttribute('aria-hidden', 'false');

    function setStatus(msg, success) {
      statusEl.textContent = msg || '';
      statusEl.classList.toggle('success', !!success);
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) resolve();
          else reject(new Error('execCommand copy failed'));
        } catch (err) {
          reject(err);
        }
      });
    }

    function getExportPayload(adoptersSet) {
      var sorted = Array.from(new Set(Array.from(adoptersSet))).sort();
      return {
        _meta: {
          schema: 'lgaCode',
          asgsYear: 2024,
          datum: 'GDA2020',
          note: 'Each entry is an ABS LGA_CODE24 (5 digits). Add councils from any state using the same codes.'
        },
        adopters: sorted
      };
    }

    function roundCoord(value) {
      return Number(value).toFixed(5);
    }

    function edgeKey(a, b) {
      var p1 = roundCoord(a[0]) + ',' + roundCoord(a[1]);
      var p2 = roundCoord(b[0]) + ',' + roundCoord(b[1]);
      return p1 < p2 ? (p1 + '|' + p2) : (p2 + '|' + p1);
    }

    function forEachRingInGeometry(geometry, callback) {
      if (!geometry || !geometry.type || !geometry.coordinates) return;
      if (geometry.type === 'Polygon') {
        geometry.coordinates.forEach(function (ring) { callback(ring); });
        return;
      }
      if (geometry.type === 'MultiPolygon') {
        geometry.coordinates.forEach(function (polygon) {
          polygon.forEach(function (ring) { callback(ring); });
        });
      }
    }

    function buildNeighborsByCode(features) {
      var edgeToCodes = Object.create(null);
      var neighborsByCode = Object.create(null);

      features.forEach(function (feature) {
        var p = feature.properties || {};
        var code = String(p.lgaCode || '').trim();
        if (!code) return;
        if (!neighborsByCode[code]) neighborsByCode[code] = new Set();

        forEachRingInGeometry(feature.geometry, function (ring) {
          if (!Array.isArray(ring) || ring.length < 2) return;
          for (var i = 1; i < ring.length; i += 1) {
            var prev = ring[i - 1];
            var curr = ring[i];
            if (!prev || !curr || prev.length < 2 || curr.length < 2) continue;
            if (prev[0] === curr[0] && prev[1] === curr[1]) continue;
            var key = edgeKey(prev, curr);
            if (!edgeToCodes[key]) edgeToCodes[key] = new Set();
            edgeToCodes[key].add(code);
          }
        });
      });

      Object.keys(edgeToCodes).forEach(function (key) {
        var codes = Array.from(edgeToCodes[key]);
        if (codes.length < 2) return;
        for (var i = 0; i < codes.length; i += 1) {
          for (var j = i + 1; j < codes.length; j += 1) {
            var a = codes[i];
            var b = codes[j];
            neighborsByCode[a].add(b);
            neighborsByCode[b].add(a);
          }
        }
      });
      return neighborsByCode;
    }

    // Boundaries: ABS ASGS Edition 3 Local Government Areas 2024 (GDA2020), simplified for web.
    // Build from: scripts/build_councils_au.py — see script header for ABS download URL.
    Promise.all([
      fetch('data/tag-adopters.json').then(function (r) {
        if (!r.ok) throw new Error('Failed to load tag-adopters.json: ' + r.status);
        return r.json();
      }),
      fetch('data/geo/councils-au.geojson').then(function (r) {
        if (!r.ok) throw new Error('Failed to load councils-au.geojson: ' + r.status);
        return r.json();
      })
    ]).then(function (results) {
      var tagPayload = results[0];
      var geoData = results[1];
      var initialList = tagPayload.adopters;
      if (!Array.isArray(initialList)) {
        throw new Error('tag-adopters.json must contain an "adopters" array');
      }

      var allCouncils = geoData.features.map(function (feature) {
        var p = feature.properties || {};
        var stateAbbrev = stateCodeToAbbrev[String(p.stateCode)] || (p.stateName || 'OT');
        return {
          lgaCode: String(p.lgaCode || '').trim(),
          lgaName: String(p.lgaName || ''),
          stateCode: String(p.stateCode || ''),
          stateName: String(p.stateName || ''),
          stateAbbrev: stateAbbrev
        };
      }).filter(function (c) {
        return c.lgaCode && c.lgaName;
      }).sort(function (a, b) {
        if (a.stateAbbrev === b.stateAbbrev) {
          return a.lgaName.localeCompare(b.lgaName);
        }
        return stateOrder.indexOf(a.stateAbbrev) - stateOrder.indexOf(b.stateAbbrev);
      });

      var baselineAdopters = new Set(initialList.map(function (c) { return String(c).trim(); }));
      var adopters = new Set(Array.from(baselineAdopters));
      var neighborsByCode = buildNeighborsByCode(geoData.features);
      var shadeByCode = Object.create(null);

      function recomputePartnerShades() {
        shadeByCode = Object.create(null);
        var usage = new Array(PARTNER_SHADES.length).fill(0);
        var partnerCodes = Array.from(adopters);

        partnerCodes.sort(function (a, b) {
          var neighborsA = neighborsByCode[a] || new Set();
          var neighborsB = neighborsByCode[b] || new Set();
          var degreeA = 0;
          var degreeB = 0;
          neighborsA.forEach(function (n) { if (adopters.has(n)) degreeA += 1; });
          neighborsB.forEach(function (n) { if (adopters.has(n)) degreeB += 1; });
          return degreeB - degreeA || a.localeCompare(b);
        });

        partnerCodes.forEach(function (code) {
          var blocked = new Set();
          var neighbors = neighborsByCode[code] || new Set();
          neighbors.forEach(function (n) {
            if (shadeByCode[n] !== undefined) blocked.add(shadeByCode[n]);
          });

          var chosen = -1;
          for (var i = 0; i < PARTNER_SHADES.length; i += 1) {
            if (!blocked.has(i)) {
              chosen = i;
              break;
            }
          }
          if (chosen === -1) {
            var minUsage = usage[0];
            chosen = 0;
            for (var j = 1; j < usage.length; j += 1) {
              if (usage[j] < minUsage) {
                minUsage = usage[j];
                chosen = j;
              }
            }
            console.warn('Partner shading exceeded palette for', code);
          }
          shadeByCode[code] = chosen;
          usage[chosen] += 1;
        });
      }

      function getCouncilStyle(feature) {
        var code = feature.properties && feature.properties.lgaCode;
        var normalizedCode = code == null ? '' : String(code);
        var isTag = normalizedCode && adopters.has(normalizedCode);
        var shadeIdx = shadeByCode[normalizedCode];
        var borderColor = isTag ? '#c000ff' : '#2f8fff';
        var borderOpacity = isTag ? 1 : 0.7;
        return {
          fillColor: isTag ? PARTNER_SHADES[shadeIdx != null ? shadeIdx : 0] : 'gray',
          weight: 1,
          opacity: borderOpacity,
          color: borderColor,
          fillOpacity: isTag ? 0.6 : 0.2
        };
      }

      recomputePartnerShades();

      var mapLayer = L.geoJson(geoData, {
        style: getCouncilStyle,
        onEachFeature: function (feature, layer) {
          var p = feature.properties;
          if (p && p.lgaName) {
            var label = p.lgaName + (p.stateName ? ' (' + p.stateName + ')' : '');
            if (p.lgaCode) {
              label += ' - ' + p.lgaCode;
            }
            layer.bindPopup(label);
          }
        }
      }).addTo(map);

      // Fit on mainland/state councils (exclude OT extents) so Australia starts close
      // without clipping. Re-run after layout settles and on resize.
      var continentalEnvelope = L.latLngBounds(
        L.latLng(-45.5, 110.0),
        L.latLng(-9.0, 155.5)
      );

      function fitMapToBounds(bounds, padding) {
        if (!bounds || !bounds.isValid()) return;
        map.invalidateSize();
        map.fitBounds(bounds, { padding: padding || [8, 8], animate: false });
      }

      function fitAustraliaToPane() {
        fitMapToBounds(continentalEnvelope, [8, 8]);
      }
      fitAustraliaToPane();
      setTimeout(fitAustraliaToPane, 0);
      window.addEventListener('resize', fitAustraliaToPane);

      var stateBoundsByAbbrev = {};
      var lgaBoundsByCode = {};
      geoData.features.forEach(function (feature) {
        var p = feature.properties || {};
        var st = stateCodeToAbbrev[String(p.stateCode)] || (p.stateName || 'OT');
        var code = String(p.lgaCode || '');
        var b = L.geoJson(feature).getBounds();
        if (!b.isValid()) return;
        if (!stateBoundsByAbbrev[st]) stateBoundsByAbbrev[st] = L.latLngBounds([]);
        stateBoundsByAbbrev[st].extend(b);
        if (code) {
          if (!lgaBoundsByCode[code]) lgaBoundsByCode[code] = L.latLngBounds([]);
          lgaBoundsByCode[code].extend(b);
        }
      });

      function refreshMap() {
        recomputePartnerShades();
        mapLayer.setStyle(getCouncilStyle);
      }

      var byState = {};
      allCouncils.forEach(function (c) {
        if (!byState[c.stateAbbrev]) byState[c.stateAbbrev] = [];
        byState[c.stateAbbrev].push(c);
      });

      var currentView = 'partners'; // partners | manage

      function applyViewMode() {
        var isPartnersView = currentView === 'partners';
        partnersViewBtn.classList.toggle('active', isPartnersView);
        manageViewBtn.classList.toggle('active', !isPartnersView);
        sidebarTitle.textContent = isPartnersView ? 'TAG Partners' : 'Manage Partners';
        hintText.textContent = isPartnersView
          ? 'Showing current TAG Partners only, grouped by state.'
          : 'Toggle councils on/off. Councils are grouped by state. Use search to jump quickly.';
        webWarning.style.display = (!isLocalAdmin && !isPartnersView) ? 'block' : 'none';
        searchInput.style.display = isPartnersView ? 'none' : '';
        suggestionsEl.className = 'suggestions';
        suggestionsEl.innerHTML = '';
        exportBtn.parentElement.classList.toggle('hidden', isPartnersView);
        partnersTotalEl.style.display = isPartnersView ? '' : 'none';
      }

      partnersViewBtn.addEventListener('click', function () {
        currentView = 'partners';
        applyViewMode();
        renderStateSections(false);
        setStatus('', false);
      });

      manageViewBtn.addEventListener('click', function () {
        currentView = 'manage';
        applyViewMode();
        renderStateSections(false);
        searchInput.focus();
      });

      function renderStateSections(expandMatches) {
        stateContainer.innerHTML = '';
        var query = currentView === 'manage' ? searchInput.value.trim().toLowerCase() : '';
        stateOrder.forEach(function (st) {
          var councils = byState[st];
          if (!councils || councils.length === 0) return;

          var filtered = councils.filter(function (c) {
            return currentView === 'manage' || adopters.has(c.lgaCode);
          });
          if (filtered.length === 0) return;

          if (query && currentView === 'manage') {
            filtered = councils.filter(function (c) {
              return c.lgaName.toLowerCase().indexOf(query) !== -1 || c.lgaCode.indexOf(query) !== -1;
            });
            if (filtered.length === 0) return;
          }

          var adopterCount = councils.filter(function (c) { return adopters.has(c.lgaCode); }).length;

          var section = document.createElement('section');
          section.className = 'state-section';

          var header = document.createElement('button');
          header.className = 'state-header';
          header.type = 'button';
          header.innerHTML = '<strong class="state-zoom" title="Zoom to ' + st + '">' + st + '</strong><span>' + adopterCount + '/' + councils.length + '</span>';

          var list = document.createElement('div');
          list.className = 'state-list';
          if (expandMatches || currentView === 'partners' || st === 'VIC') list.classList.add('open');

          filtered.forEach(function (c) {
            var row = document.createElement('label');
            row.className = 'council-row';
            row.setAttribute('for', 'adopter_' + c.lgaCode);

            var left = document.createElement('span');
            left.innerHTML = '<span class="council-zoom" title="Zoom to ' + c.lgaName + '">' + c.lgaName + '</span> <span class="code">' + c.lgaCode + '</span>';
            var lgaZoomLabel = left.querySelector('.council-zoom');
            lgaZoomLabel.addEventListener('click', function (evt) {
              evt.preventDefault();
              evt.stopPropagation();
              var lgaBounds = lgaBoundsByCode[c.lgaCode];
              fitMapToBounds(lgaBounds, [24, 24]);
            });

            row.appendChild(left);
            if (currentView === 'manage') {
              var checkbox = document.createElement('input');
              checkbox.type = 'checkbox';
              checkbox.id = 'adopter_' + c.lgaCode;
              checkbox.checked = adopters.has(c.lgaCode);
              checkbox.addEventListener('change', function () {
                if (checkbox.checked) {
                  adopters.add(c.lgaCode);
                } else {
                  adopters.delete(c.lgaCode);
                }
                refreshMap();
                renderSuggestions(searchInput.value);
                renderStateSections(false);
                setStatus('Unsaved changes: ' + getDiffSummary(), false);
              });
              row.appendChild(checkbox);
            } else {
              var tag = document.createElement('span');
              tag.className = 'code';
              tag.textContent = 'Partner';
              row.appendChild(tag);
            }
            list.appendChild(row);
          });

          header.addEventListener('click', function () {
            list.classList.toggle('open');
          });

          var zoomLabel = header.querySelector('.state-zoom');
          zoomLabel.addEventListener('click', function (evt) {
            evt.preventDefault();
            evt.stopPropagation();
            var stateBounds = stateBoundsByAbbrev[st];
            fitMapToBounds(stateBounds, [12, 12]);
          });

          section.appendChild(header);
          section.appendChild(list);
          stateContainer.appendChild(section);
        });

        partnersTotalEl.textContent = 'Total TAG Partners: ' + adopters.size + '/' + allCouncils.length;
      }

      function rankMatch(c, q) {
        var name = c.lgaName.toLowerCase();
        var code = c.lgaCode;
        if (code === q) return 0;
        if (code.indexOf(q) === 0) return 1;
        if (name.indexOf(q) === 0) return 2;
        if (name.indexOf(q) !== -1) return 3;
        return 99;
      }

      function renderSuggestions(rawQuery) {
        if (currentView !== 'manage') {
          suggestionsEl.className = 'suggestions';
          suggestionsEl.innerHTML = '';
          return;
        }
        var q = (rawQuery || '').trim().toLowerCase();
        if (!q) {
          suggestionsEl.className = 'suggestions';
          suggestionsEl.innerHTML = '';
          return;
        }

        var matches = allCouncils
          .map(function (c) { return { council: c, rank: rankMatch(c, q) }; })
          .filter(function (r) { return r.rank < 99; })
          .sort(function (a, b) {
            if (a.rank !== b.rank) return a.rank - b.rank;
            return a.council.lgaName.localeCompare(b.council.lgaName);
          })
          .slice(0, 20);

        suggestionsEl.className = 'suggestions active';
        if (matches.length === 0) {
          suggestionsEl.innerHTML = '<p class="suggestions-title">No matches</p>';
          return;
        }

        suggestionsEl.innerHTML = '<p class="suggestions-title">Likely matches</p>';
        matches.forEach(function (entry) {
          var c = entry.council;
          var row = document.createElement('label');
          row.className = 'suggestion-row';
          row.setAttribute('for', 'suggest_' + c.lgaCode);

          var left = document.createElement('span');
          left.innerHTML = c.lgaName + ' <span class="code">' + c.stateAbbrev + ' ' + c.lgaCode + '</span>';

          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.id = 'suggest_' + c.lgaCode;
          cb.checked = adopters.has(c.lgaCode);
          cb.addEventListener('change', function () {
            if (cb.checked) adopters.add(c.lgaCode);
            else adopters.delete(c.lgaCode);
            refreshMap();
            renderSuggestions(searchInput.value);
            renderStateSections(true);
            setStatus('Unsaved changes: ' + getDiffSummary(), false);
          });

          row.appendChild(left);
          row.appendChild(cb);
          suggestionsEl.appendChild(row);
        });
      }

      function getDiff() {
        var added = [];
        var removed = [];
        adopters.forEach(function (code) {
          if (!baselineAdopters.has(code)) added.push(code);
        });
        baselineAdopters.forEach(function (code) {
          if (!adopters.has(code)) removed.push(code);
        });
        added.sort();
        removed.sort();
        return { added: added, removed: removed };
      }

      function getDiffSummary() {
        var d = getDiff();
        return '+' + d.added.length + ' / -' + d.removed.length;
      }

      function buildRequestText() {
        var d = getDiff();
        var byCode = {};
        allCouncils.forEach(function (c) { byCode[c.lgaCode] = c; });

        var lines = ['Please update TAG Partners.', '', 'Add:'];
        if (d.added.length === 0) lines.push('- None');
        d.added.forEach(function (code) {
          var c = byCode[code];
          lines.push('- ' + (c ? c.lgaName : 'Unknown') + ' (' + code + ')');
        });

        lines.push('', 'Remove:');
        if (d.removed.length === 0) lines.push('- None');
        d.removed.forEach(function (code) {
          var c = byCode[code];
          lines.push('- ' + (c ? c.lgaName : 'Unknown') + ' (' + code + ')');
        });

        lines.push('', 'Generated from TAG Councils map TAG Partners manager.');
        return lines.join('\n');
      }

      searchInput.addEventListener('input', function () {
        renderSuggestions(searchInput.value);
        renderStateSections(!!searchInput.value.trim());
      });

      exportBtn.addEventListener('click', function () {
        if (!isLocalAdmin) {
          setStatus('Export disabled in shared web mode. Use Request changes from Hailey.', false);
          return;
        }
        var payload = getExportPayload(adopters);
        var blob = new Blob([JSON.stringify(payload, null, 2) + '\n'], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'tag-adopters.updated.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setStatus('Exported tag-adopters.updated.json. Replace data/tag-adopters.json and commit.', true);
      });

      copyBtn.addEventListener('click', function () {
        var text = JSON.stringify(getExportPayload(adopters), null, 2) + '\n';
        copyTextToClipboard(text).then(function () {
          setStatus('Copied JSON to clipboard.', true);
        }).catch(function () {
          setStatus('Could not copy to clipboard. Use Export JSON, or add ?admin=1 to force local mode.', false);
        });
      });

      resetBtn.addEventListener('click', function () {
        adopters = new Set(Array.from(baselineAdopters));
        refreshMap();
        renderSuggestions(searchInput.value);
        renderStateSections(!!searchInput.value.trim());
        setStatus('Reset to loaded TAG Partners.', true);
      });

      requestBtn.addEventListener('click', function () {
        var body = buildRequestText();
        if (!isLocalAdmin) {
          var subject = 'TAG Partners change request';
          var href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
          window.location.href = href;
          setStatus('Drafted request email with your proposed changes.', true);
          return;
        }
        copyTextToClipboard(body).then(function () {
          setStatus('Copied request text to clipboard (useful for PR notes).', true);
        }).catch(function () {
          setStatus('Could not copy request text.', false);
        });
      });

      if (!isLocalAdmin) {
        exportBtn.disabled = true;
        setStatus('Web shared mode: export is disabled. Open via localhost/private LAN IP or use ?admin=1 for local admin mode.', false);
      }

      applyViewMode();
      renderStateSections(false);
      renderSuggestions('');

      var absNote = L.control({ position: 'bottomright' });
      absNote.onAdd = function () {
        var d = L.DomUtil.create('div', 'abs-attribution');
        d.innerHTML = 'LGA boundaries: ABS ASGS 2024 (simplified). Check ABS licence before public use.';
        return d;
      };
      absNote.addTo(map);
    }).catch(function (err) {
      console.error(err);
      document.body.insertAdjacentHTML(
        'afterbegin',
        '<p style="font-family:sans-serif;padding:1rem;background:#fee;color:#800;">Map data failed to load. ' +
        'Run <code>python3 scripts/build_councils_au.py --download</code> from the repo root to fetch ABS boundaries and build <code>data/geo/councils-au.geojson</code>.</p>'
      );
    });
  </script>
